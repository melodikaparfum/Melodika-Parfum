<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodika Parfum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f0f0f; color: #f3f4f6; font-family: sans-serif; }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #000; }
        .gold-bg:hover { background-color: #b9972a; }
        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto space-y-4">
        
        <!-- STATUS QUTUSU -->
        <div id="debugBox" class="bg-zinc-900 border border-yellow-600 p-3 rounded-xl text-xs text-yellow-400 font-mono">
            Status: Qoşulma yoxlanılır...
        </div>

        <!-- GİRİŞ -->
        <div id="loginScreen" class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl max-w-sm mx-auto mt-6 text-center">
            <h1 class="text-2xl font-bold gold-text mb-4">MELODİKA PARFUM</h1>
            <input type="password" id="pinInput" placeholder="PİN Kod" class="w-full text-center text-xl bg-zinc-800 border border-zinc-700 p-3 rounded-lg text-white mb-4 focus:outline-none gold-border">
            <button onclick="login()" class="w-full gold-bg font-bold py-3 rounded-lg">Daxil Ol</button>
            <p id="loginError" class="text-red-500 text-sm mt-2 hidden-screen">Yanlış PİN kod!</p>
        </div>

        <!-- ƏSAS PANEL -->
        <div id="mainApp" class="hidden-screen space-y-4">
            <header class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h1 class="text-lg font-bold gold-text" id="roleTitle">MELODİKA</h1>
                <button onclick="logout()" class="text-xs bg-red-900 text-white px-3 py-1 rounded">Çıxış</button>
            </header>

            <!-- Əməliyyat Forması -->
            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3">
                <h2 class="text-sm font-semibold gold-text">Satış / Əməliyyat</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <select id="opType" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                        <option value="MEXARIC">Məxaric (Satış)</option>
                        <option value="MEDAXIL">Mədaxil</option>
                        <option value="ITKI">İtki</option>
                    </select>
                    <select id="opProduct" onchange="calcPrice()" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                        <option value="">Məhsul seçin...</option>
                    </select>
                    <input type="number" id="opGram" oninput="calcPrice()" placeholder="Miqdar (qr/ədəd)" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" step="0.01" id="opPrice" placeholder="Yekun Qiymət (AZN)" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                    <input type="number" id="opDiscount" oninput="calcPrice()" placeholder="Endirim %" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                </div>
                <button onclick="saveOp()" class="w-full gold-bg font-bold py-2.5 rounded text-sm">Təsdiq Et</button>
            </div>

            <!-- Məhsul Əlavə (Admin) -->
            <div id="adminBox" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3 hidden-screen">
                <h2 class="text-sm font-semibold gold-text">Yeni Məhsul / Ətir Əlavə Et</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <input type="text" id="pCode" placeholder="Kod" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                    <input type="text" id="pName" placeholder="Ad" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                    <input type="number" step="0.01" id="pBuy" placeholder="Alış (1qr)" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                    <input type="number" step="0.01" id="pSell" placeholder="Satış (1qr)" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                </div>
                <button onclick="addProd()" class="gold-bg font-bold px-4 py-2 rounded text-xs">Əlavə Et</button>
            </div>

            <!-- Cədvəl -->
            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
                <h3 class="text-sm font-semibold gold-text mb-2">Anbar və Jurnal</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left
