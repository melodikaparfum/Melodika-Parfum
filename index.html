<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodika Parfum</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f0f0f; color: #f3f4f6; font-family: sans-serif; }
        .gold-border { border-color: #d4af37; }
        .gold-text { color: #d4af37; }
        .gold-bg { background-color: #d4af37; color: #000; }
        .gold-bg:hover { background-color: #b9972a; }
        .hidden-screen { display: none !important; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-4xl mx-auto space-y-4">
        
        <!-- DİAQNOSTİKA QUTUSU (Xətanı görmək üçün) -->
        <div id="debugBox" class="bg-zinc-900 border border-yellow-600 p-3 rounded-xl text-xs text-yellow-400 font-mono">
            Status: Sistem başladılır...
        </div>

        <!-- GİRİŞ -->
        <div id="loginScreen" class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl max-w-sm mx-auto mt-6 text-center">
            <h1 class="text-2xl font-bold gold-text mb-4">MELODİKA PARFUM</h1>
            <input type="password" id="pinInput" placeholder="PİN Kod" class="w-full text-center text-xl bg-zinc-800 border border-zinc-700 p-3 rounded-lg text-white mb-4 focus:outline-none gold-border">
            <button onclick="login()" class="w-full gold-bg font-bold py-3 rounded-lg">Daxil Ol</button>
            <p id="loginError" class="text-red-500 text-sm mt-2 hidden-screen">Yanlış PİN kod!</p>
        </div>

        <!-- ƏSAS PANEL -->
        <div id="mainApp" class="hidden-screen space-y-4">
            <header class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h1 class="text-lg font-bold gold-text" id="roleTitle">MELODİKA</h1>
                <button onclick="logout()" class="text-xs bg-red-900 text-white px-3 py-1 rounded">Çıxış</button>
            </header>

            <!-- Əməliyyat Forması -->
            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3">
                <h2 class="text-sm font-semibold gold-text">Satış / Əməliyyat</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <select id="opType" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                        <option value="MEXARIC">Məxaric (Satış)</option>
                        <option value="MEDAXIL">Mədaxil</option>
                        <option value="ITKI">İtki</option>
                    </select>
                    <select id="opProduct" onchange="calcPrice()" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                        <option value="">Məhsul seçin...</option>
                    </select>
                    <input type="number" id="opGram" oninput="calcPrice()" placeholder="Miqdar (qr/ədəd)" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" step="0.01" id="opPrice" placeholder="Yekun Qiymət (AZN)" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                    <input type="number" id="opDiscount" oninput="calcPrice()" placeholder="Endirim %" class="bg-zinc-800 border border-zinc-700 p-2.5 rounded text-white text-sm">
                </div>
                <button onclick="saveOp()" class="w-full gold-bg font-bold py-2.5 rounded text-sm">Təsdiq Et</button>
            </div>

            <!-- Məhsul Əlavə (Admin) -->
            <div id="adminBox" class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl space-y-3 hidden-screen">
                <h2 class="text-sm font-semibold gold-text">Yeni Məhsul / Ətir Əlavə Et</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <input type="text" id="pCode" placeholder="Kod" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                    <input type="text" id="pName" placeholder="Ad" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                    <input type="number" step="0.01" id="pBuy" placeholder="Alış (1qr)" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                    <input type="number" step="0.01" id="pSell" placeholder="Satış (1qr)" class="bg-zinc-800 border border-zinc-700 p-2 rounded text-white text-sm">
                </div>
                <button onclick="addProd()" class="gold-bg font-bold px-4 py-2 rounded text-xs">Əlavə Et</button>
            </div>

            <!-- Cədvəl -->
            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl">
                <h3 class="text-sm font-semibold gold-text mb-2">Anbar və Jurnal</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-zinc-300">
                        <thead class="border-b border-zinc-800 gold-text">
                            <tr><th>Kod</th><th>Ad</th><th>Satış Qiyməti</th></tr>
                        </thead>
                        <tbody id="prodTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://jauzzzwwqxsxyuopapvl.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphdXp6endxcXhzeHl1b3BhcHZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxODEwMDQsImV4cCI6MjEwOTc1NzAwNH0.gOjs41EGeGVqrwlaoIGpB0qwpeV4jpP44_9HEfgqYnk';
        
        let _supabase;
        try {
            _supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);
            document.getElementById('debugBox').textContent = "Status: Supabase klientı uğurla yaradıldı.";
        } catch(e) {
            document.getElementById('debugBox').textContent = "Kritik Xəta: " + e.message;
        }

        let products = [];
        let role = '';

        function login() {
            let pin = document.getElementById('pinInput').value;
            if(pin === '08102000') role = 'ADMIN';
            else if(pin === '112233') role = 'SATICI';
            else { document.getElementById('loginError').classList.remove('hidden-screen'); return; }

            document.getElementById('loginScreen').classList.add('hidden-screen');
            document.getElementById('mainApp').classList.remove('hidden-screen');
            if(role === 'ADMIN') document.getElementById('adminBox').classList.remove('hidden-screen');
            document.getElementById('roleTitle').textContent = `MELODİKA — ${role}`;
            loadData();
        }

        function logout() { location.reload(); }

        async function loadData() {
            document.getElementById('debugBox').textContent = "Status: Bazadan məlumatlar çəkilir...";
            try {
                let { data, error } = await _supabase.from('products').select('*');
                if(error) {
                    document.getElementById('debugBox').textContent = "Baza Xətası: " + error.message;
                    return;
                }
                products = data || [];
                document.getElementById('debugBox').textContent = `Status: Məlumat uğurla gəldi (${products.length} məhsul).`;
                
                let sel = document.getElementById('opProduct');
                sel.innerHTML = '<option value="">Məhsul seçin...</option>';
                let html = '';
                products.forEach(p => {
                    sel.innerHTML += `<option value="${p.id}">[${p.code}] ${p.name}</option>`;
                    html += `<tr class="border-b border-zinc-800"><td class="py-1">${p.code}</td><td class="py-1">${p.name}</td><td class="py-1">${p.sell_price} AZN</td></tr>`;
                });
                document.getElementById('prodTable').innerHTML = html || '<tr><td colspan="3" class="py-1 text-zinc-500">Məhsul yoxdur</td></tr>';
            } catch(err) {
                document.getElementById('debugBox').textContent = "Şəbəkə Xətası (Fetch Failed): " + err.message;
            }
        }

        async function addProd() {
            let code = document.getElementById('pCode').value;
            let name = document.getElementById('pName').value;
            let buy_price = parseFloat(document.getElementById('pBuy').value) || 0;
            let sell_price = parseFloat(document.getElementById('pSell').value) || 0;
            if(!code || !name) return alert('Kod və ad yazın!');

            let { error } = await _supabase.from('products').insert([{ code, name, buy_price, sell_price }]);
            if(error) alert(error.message);
            else { alert('Uğurla əlavə edildi!'); loadData(); }
        }

        function calcPrice() {
            let id = document.getElementById('opProduct').value;
            let gram = parseFloat(document.getElementById('opGram').value) || 0;
            let disc = parseFloat(document.getElementById('opDiscount').value) || 0;
            let p = products.find(x => x.id == id);
            if(!p) return;
            let total = gram * (p.sell_price || 0);
            if(disc > 0) total -= total * (disc / 100);
            document.getElementById('opPrice').value = total.toFixed(2);
        }

        async function saveOp() {
            let product_id = document.getElementById('opProduct').value;
            let type = document.getElementById('opType').value;
            let grams_sold = parseFloat(document.getElementById('opGram').value);
            let total_price = parseFloat(document.getElementById('opPrice').value);
            if(!product_id || !grams_sold) return alert('Məlumatları doldurun!');

            let p = products.find(x => x.id == product_id);
            let total_cost = grams_sold * (p.buy_price || 0);
            let profit = total_price - total_cost;

            let { error } = await _supabase.from('sales').insert([{ product_id, type, grams_sold, total_price, total_cost, profit }]);
            if(error) alert(error.message);
            else { alert('Əməliyyat yadda saxlanıldı!'); document.getElementById('opGram').value=''; document.getElementById('opPrice').value=''; }
        }
    </script>
</body>
</html>
